<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestarter - Web Extractor Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darkbg: '#0f172a', cardbg: '#1e293b' }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-6">
    <div class="w-full max-w-3xl mx-auto space-y-6">
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">🔥 Firestarter - Extrator Web</h1>
            <p class="text-sm text-slate-400">Demonstração de ponta a ponta (Backend Bun + Frontend HTML)</p>
        </header>

        <div class="bg-cardbg border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">URL Alvo</label>
                <div class="flex gap-2">
                    <input type="url" id="targetUrl" placeholder="https://news.ycombinator.com" value="https://news.ycombinator.com"
                        class="flex-1 bg-darkbg border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                    <button onclick="handleScrape()" id="scrapeBtn"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-all">
                        Extrair
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Endpoint da API Backend</label>
                <input type="text" id="apiUrl" value="http://localhost:3001/v1/scrape" 
                    class="w-full bg-darkbg border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-300 font-mono">
            </div>
        </div>

        <div class="bg-cardbg border border-slate-800 rounded-xl p-5 shadow-lg space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-sm font-medium text-indigo-400">Resultado (Markdown Limpo)</span>
                <button onclick="copyOutput()" id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded">Copiar</button>
            </div>
            <div id="tabPreview" class="min-h-[250px] max-h-[450px] overflow-y-auto p-4 bg-darkbg rounded-lg border border-slate-800 text-sm leading-relaxed">
                <p class="text-slate-500 italic">O resultado da extração aparecerá aqui...</p>
            </div>
        </div>
    </div>

    <script>
        let currentMarkdown = "";

        async function handleScrape() {
            const url = document.getElementById('targetUrl').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const btn = document.getElementById('scrapeBtn');
            const previewDiv = document.getElementById('tabPreview');

            if (!url) return alert('Insira uma URL.');

            btn.disabled = true;
            btn.textContent = "Extraindo...";
            previewDiv.innerHTML = `<p class="text-indigo-400 animate-pulse">Processando requisição no backend...</p>`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (response.ok) {
                    currentMarkdown = data.markdown || "Extraído com sucesso!";
                    previewDiv.innerHTML = marked.parse(currentMarkdown);
                } else {
                    previewDiv.innerHTML = `<p class="text-red-400">Erro: ${data.error || 'Falha ao processar'}</p>`;
                }
            } catch (error) {
                previewDiv.innerHTML = `<p class="text-red-400">Erro de conexão: Verifique se o servidor está rodando.</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Extrair";
            }
        }

        function copyOutput() {
            if (!currentMarkdown) return alert('Nada para copiar.');
            navigator.clipboard.writeText(currentMarkdown);
            const btn = document.getElementById('copyBtn');
            btn.textContent = "Copiado!";
            setTimeout(() => btn.textContent = "Copiar", 2000);
        }
    </script>
</body>
</html>
