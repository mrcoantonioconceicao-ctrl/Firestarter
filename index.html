<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestarter | Enterprise RAG Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-6 mt-6">
        <header class="flex justify-between items-center pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-black text-amber-500 tracking-wider">🔥 FIRESTARTER</h1>
                <p class="text-xs text-slate-400">Autonomous Web Extractor & GraphRAG Ingestion Engine</p>
            </div>
            <span class="px-3 py-1 bg-emerald-950 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-800">Production Ready</span>
        </header>

        <div class="mt-6 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Endpoint API & URL Alvo</label>
                <div class="flex gap-2">
                    <input type="text" id="targetUrl" placeholder="https://exemplo.com/artigo" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                    <button onclick="startScraping()" id="scrapeBtn" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-6 py-2 rounded-lg text-sm transition-all shadow-lg">Extrair & Ingerir</button>
                </div>
            </div>

            <!-- Métricas Executivas -->
            <div id="metrics" class="hidden grid grid-cols-3 gap-4 pt-2">
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center">
                    <span class="block text-xs text-slate-500">Total Carateres</span>
                    <span id="statChars" class="text-lg font-bold text-amber-400">-</span>
                </div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center">
                    <span class="block text-xs text-slate-500">Blocos (Chunks)</span>
                    <span id="statChunks" class="text-lg font-bold text-amber-400">-</span>
                </div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center">
                    <span class="block text-xs text-slate-500">Tokens Est.</span>
                    <span id="statTokens" class="text-lg font-bold text-amber-400">-</span>
                </div>
            </div>

            <!-- Resultados -->
            <div class="pt-4 border-t border-slate-800">
                <div class="flex border-b border-slate-800 mb-4">
                    <button onclick="switchTab('markdown')" id="tabMd" class="px-4 py-2 text-sm font-bold border-b-2 border-amber-500 text-amber-500">Markdown View</button>
                    <button onclick="switchTab('chunks')" id="tabChunks" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200">GraphRAG Chunks</button>
                </div>

                <div id="viewMarkdown" class="bg-slate-950 border border-slate-800 rounded-lg p-4 min-h-[300px] max-h-[500px] overflow-y-auto text-sm leading-relaxed prose prose-invert">
                    <span class="text-slate-600 italic">Insira uma URL e clique em extrair para ver o payload processado...</span>
                </div>

                <div id="viewChunks" class="hidden space-y-3 max-h-[500px] overflow-y-auto">
                    <span class="text-slate-600 italic">Os blocos segmentados aparecerão aqui...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;

        async function startScraping() {
            const urlInput = document.getElementById("targetUrl").value;
            const btn = document.getElementById("scrapeBtn");
            const mdView = document.getElementById("viewMarkdown");

            if (!urlInput) {
                alert("Por favor, insira uma URL válida.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "A processar...";
            mdView.innerHTML = '<span class="text-amber-400 animate-pulse">A executar extração de alta performance via Cheerio + Bun...</span>';

            try {
                const res = await fetch("http://127.0.0.1:3001/v1/ingest", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await res.json();
                if (!data.success) throw new Error(data.error);

                currentData = data;

                // Atualizar Métricas
                document.getElementById("metrics").classList.remove("hidden");
                document.getElementById("statChars").innerText = data.metadata.totalLength.toLocaleString();
                document.getElementById("statChunks").innerText = data.metadata.totalChunks;
                document.getElementById("statTokens").innerText = data.metadata.estimatedTokens.toLocaleString();

                // Renderizar Markdown
                mdView.innerHTML = marked.parse(data.markdown);

                // Renderizar Chunks
                const chunksView = document.getElementById("viewChunks");
                chunksView.innerHTML = data.chunks.map((chunk, idx) => `
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-xs font-mono">
                        <div class="text-amber-500 font-bold mb-1">CHUNK #${idx + 1}</div>
                        <p class="text-slate-300">${chunk}</p>
                    </div>
                `).join("");

            } catch (err) {
                mdView.innerHTML = `<span class="text-red-400">Erro na extração: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Extrair & Ingerir";
            }
        }

        function switchTab(tab) {
            const mdTab = document.getElementById("tabMd");
            const chunksTab = document.getElementById("tabChunks");
            const mdView = document.getElementById("viewMarkdown");
            const chunksView = document.getElementById("viewChunks");

            if (tab === 'markdown') {
                mdTab.className = "px-4 py-2 text-sm font-bold border-b-2 border-amber-500 text-amber-500";
                chunksTab.className = "px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200";
                mdView.classList.remove("hidden");
                chunksView.classList.add("hidden");
            } else {
                chunksTab.className = "px-4 py-2 text-sm font-bold border-b-2 border-amber-500 text-amber-500";
                mdTab.className = "px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200";
                chunksView.classList.remove("hidden");
                mdView.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
